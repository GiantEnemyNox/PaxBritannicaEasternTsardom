russoasiatic:0 "Russo-Asiatic"
russoasiatic_desc:0 "Russians, who came to dominate regions of Manchuria, settled among the Chinese population, building a new outpost to spread influence of the Russian Empire in the Far East. Russo-Asiatic culture is not a separate ethnos but a general term used to describe Russian living in the eastern outreach and Asians, such as Manchu, Han, Koreans and others who were assimilated into the Russian sphere of influence. And while Russo-Asiatic is nothing but a conventional term, maybe it will turn into something more in the far future, as cultures living together will unescapably bleed into each other."
