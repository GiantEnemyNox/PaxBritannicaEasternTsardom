PBZ_zheltorossiya.1.t:0 "Report On Current Situation"
PBZ_zheltorossiya.1.d:0 "The history of Zheltorossiya is hardly a long tale and will not take much place in the history books, at least at the moment. The starting point for Zheltorossian history can be considered the august of 1910, after the end of Great War, when the Russian Empire refused to withdraw forces from the then occupied Manchuria. Manchuria was reorganized into the Tsardom of Zheltorossiya, formally an "independent" state, but in reality serving as a bastion of Russian influence in Asia and a buffer state between Russia and Jacobins in China and Japan.\n\nRussian Empire started the process of cultural assimilation, simultaneously turning Zheltorossiya into a sort of exile place for officers too troublesome to handle and too valuable to just outright dismiss. Zheltorossiya is the place where the Moscow Circle, a conspiratory group in the military, was born. They strive to pursue reactionary and imperialistic politics and are not very fond of anything related to words like "democracy" or "liberty".\n\nIt is Moscow Circle, who holds the biggest influence in the Zheltorossian politics, and it will be them who will decide the future of this part of Asia."
PBZ_zheltorossiya.1.a:0 "Report received. Dismissed."

PBZ_zheltorossiya.2.t:0 "Local Bandits Purged"
PBZ_zheltorossiya.2.d:0 "Senior sergeant lit up a rollie and with a relish took a pull at it. Finally, a smoke after a week of preparations and making the ambush. Officer commanding his unit forbid anything that could scare away bandits and an entire week without smoke was a pure torture. Even two weeks of shuffling through mud and rice fields wasn't so hard as the seven days without cigarettes. Still, remembering mud and a week of constant rain worsened his mood somewhat. After taking a few more draws from the rollie senior sergeant threw it on the ground and walked inside the hut, towards warrant officer sitting behind the makeshift table and writing a report.\n\n"Your Honour," saluted the senior sergeant, "what to do with the prisoners?" The warrant officer, not stopping writing for a moment and not even lifting his head to look at the senior sergeant, asked, "how many of them we took and how many of them are wounded?" "There are thirty seven of them captured and fifteen of them are wounded." "Shoot the wounded, the rest we will take with us," the warrant officer gave a short order. "Yes, Your Honour!""
PBZ_zheltorossiya.2.a:0 "Good. Hang the bandits publically and bring me the trophy list."

PBZ_zheltorossiya.3.t:0 "Meeting With The Former Qing Nobility"
PBZ_zheltorossiya.3.d:0 "State secretary, sitting in his cabinet, suppressed a sigh and looked into the window. The day promised to be a stressful one. The most stress would be caused by the upcoming visit of the Qing aristocrats' delegation. Former aristocrats, corrected himself the state secretary. A bunch of fools who only cared about hoarding the riches and cramming delicacies into themselves. These nobles held no love for Russia, but even the most thickheaded of them came to understand that Russia was here to stay. Stay and rule over them. And if Qing nobles obeyed Russia then they could maybe get some of their privileges back.\n\nThe clocks on the wall chimed twelve o'clock. It was time. Right after the clock had stopped, a knock at the cabinet's door sounded. Well, at least they were punctual. The state secretary looked at the door and quickly put the neutral expression on his face. It really was going to be a hard day."
PBZ_zheltorossiya.3.a:0 "Perhaps they could be of use."

PBZ_zheltorossiya.4.t:0 "Victory Parade In Mukden"
PBZ_zheltorossiya.4.d:0 "It was a sunny day, well suited for the celebration and public festivities. After the victory over the insurgents in Outer Mongolia, the Russian administration of Zheltorossiya decided to declare this day a festive one, with the goal of impressing the population and further calming it.\n\nMany activities were planned for that day. There were going to be speeches, both in Russian and Mandarin, all boasting about the might of Russia and its armies. Of course there would be food stalls, merry drinking and other things that lower classes enjoyed. One or two public executions of criminals were going to be carried out, as they always invigorated the people and raised the popularity of the government. But the main event was going to be a column of victorious troops marching through the Mukden's main street, followed by the group of defeated enemies taken as prisoners and trucks loaded with military trophies."
PBZ_zheltorossiya.4.a:0 "Triumph of the Russian weapon!"

PBZ_zheltorossiya.5.t:0 "Report On Political Situation In Zheltorossiya"
PBZ_zheltorossiya.5.d:0 "Report is not the exact word, more like a note, as the political scene is not very complex in the Tsardom. Moscow Circle is unofficially dominating in politics, though other political parties do exist here. They are barely worth a mention and don't decide anything, as the Zheltorossian Duma just signes whatever laws it was told to sign by the Moscow Circle.\n\nBut even in the Moscow Cricle, outwardly looking cohesive, exist factions, competing with each other for how Zheltorossiya should be developed. They do not compete in the usual backstabbing manner done by barbaric countries, such as Germany or Britain and they do not, God forbid, fight to death like in jacobinist Japan. No, generals and officers leisurely discuss their viewpoints in officers clubs, during horse races or poker games and other gentlemanly pastimes.\n\nThe first faction of Moscow Circle, and the one currently dominating, is the Harbin Faction. They can be called the "hardliners", as they enact reactionary policies and are quite dismissive of the native Manchurian population. The second faction is the Navy Clique and they appear moderate, at least in contrast with the Harbin Faction. They adopted a more soft stance toward the Chinese and Manchu, sometimes striking a friendship or having business dealings with them. Some officers even have gone native and married Chinese women or have taken one or two Chinese mistresses.\n\Make no mistake though, both of these factions first and foremost think about Russian interests and the Russification of Manchuria is their main goal. They are simply different sides of the same coin."
PBZ_zheltorossiya.5.a:0 "Continue to support the Harbin Faction."
PBZ_zheltorossiya.5.b:0 "Support the Navy Clique instead."
 
PBZ_zheltorossiya.6.t:0 "Report on Raids Conducted Against Dissidents"
PBZ_zheltorossiya.6.d:0 "For a week now the cities all across the Zheltorossiya had restless nights. Soldiers marched through the dark streets, doors were broken down and screams pierced the night. The hunt for traitors and spies was steadily progressing and prison cells were getting filled with the arrested people. Each arrest could lead to another two or three as our interrogators worked overtime, trying to deliver dissidents into our hands. Zheltorossiya was getting cleansed from the dangerous jacobins terrorists and order was getting restored."
PBZ_zheltorossiya.6.a:0 "Report received. Dismissed."

PBZ_zheltorossiya.7.t:0 "High Officials Meeting"
PBZ_zheltorossiya.7.d:0 "The tension hanging in the air was almost palpatable. The general meeting on matters of national development and economic security was underway. Every high ranking civilian and military official was at the meeting, listening and delivering reports, briefings and accounts. The tsar himself was presiding over the meeting, listening to speakers too. The tension, felt by everyone in the room, was a result of the delivered reports.\n\nAs one official said after finishing his account, "Frankly speaking, we are in a dire situation. We have no economy worth mentioning, our tax revenue is laughable and we almost completely depend on the support from our Motherland." Such words didn't cause an uproar, but an uneasy whisper among the listeners. "We need to hastily modernize our economy or we will simply be left behind the others.""
PBZ_zheltorossiya.7.a:0 "Well, we should do something about it."

PBZ_zheltorossiya.8.t:0 "Report On Industry And Economy Affairs"
PBZ_zheltorossiya.8.d:0 "Centralizing Industry Affairs"
PBZ_zheltorossiya.8.a:0 "We can finally move forward."

PBZ_zheltorossiya.9.t:0 "Endless Fields Of Gold"
PBZ_zheltorossiya.9.d:0 "The time spent on tillaging the land, importing agricultural machinery, preparing the chemical fertilizers and teaching workers how to properly and efficiently use it all was a time spent well.\n\nWhere once poor farmers cultivated fields by their own hands or with the help of scrawny oxes, now mighty machines are plowing the vast lands, covered by golden wheat stretching to the horizon. From this moment we are no longer in danger of famines and we can even send surplus harvest back to Russia. Now that's what we can truly call a real gold."
PBZ_zheltorossiya.9.a:0 "Food security, err, is secured!"

PBZ_zheltorossiya.10.t:0 "The Roar Of Progress"
PBZ_zheltorossiya.10.d:0 "The grand opening of the biggest engineering project ever built in the history of Zheltorossiya and, correspondingly, Manchuria is on the way. The masses have filled every available empty spot, just to see the grand ceremony and to pay respects to Tsar who came to personally participate in the opening of the dam.\n\nWhen Tsar turned the switch and the floodgates opened, cheers of the people and clicking of photographic cameras were drowned out by the roar of the water rushing down. Inside the dam, machines came to life and somewhere, far away from the place of ceremony, lights turned on and music filled the rooms."
PBZ_zheltorossiya.10.a:0 "Wonders of the modern age."

PBZ_zheltorossiya.11.t:0 "Diplomatic Mission to Europe"
PBZ_zheltorossiya.11.d:0 "Diplomatic Mission to Europe"
PBZ_zheltorossiya.11.a:0 "Surprisingly enough, the soup with snails was quite delicious."

PBZ_zheltorossiya.12.t:0 "Diplomatic Mission to Our Neighbours"
PBZ_zheltorossiya.12.d:0 "Diplomatic Mission to Our Neighbours"
PBZ_zheltorossiya.12.a:0 "The food during the banquet was too spicy."

PBZ_zheltorossiya.13.t:0 "Diplomatic Mission to Americas"
PBZ_zheltorossiya.13.d:0 "Diplomatic Mission to Americas"
PBZ_zheltorossiya.13.a:0 "Can I have one more helping of Cazuela de Mariscos?"

PBZ_zheltorossiya.14.t:0 "Visiting Our Reticent But Good Neighbour"
PBZ_zheltorossiya.14.d:0 "Far in the north, on the border between Russia and Zheltorossiya, is located a secret facility named Area Zero. The brightest minds of the Russia are working there tirelessly in order to bring prosperity and order for the empire. Contact with them should be done in a limited manner, so as to continue keeping their secrecy down the road.\n\nWhen we decide to make a contact another question will be presented before us - what manner of research will we request to help us with? Since both of us don't have unlimited resources choosing only one option is possible."
PBZ_zheltorossiya.14.a:0 "Land Warfare Research"
PBZ_zheltorossiya.14.b:0 "Nuclear Research"
PBZ_zheltorossiya.14.c:0 "Biological and Chemistry Research"

PBZ_zheltorossiya.15.t:0 "Former Princess, Now Commander"
PBZ_zheltorossiya.15.d:0 "Ekaterina Nechaeva was born Aisin Gioro Xianyu, in the family of Manchu royalty from Aisin Gioro clan. Her life is an interesting  and even unusual one, to say the least. During the Russian occupation of Manchuria in the early 20th century many Qing nobles abandoned their fealty to homeland and joined forces with the Russian Empire. Some did it out of fear of losing their lives and possesions, some did it out of foresight of inescapable decline of China and some did it hoping that new rulers of Manchuria will be more generous that the Beijing. For what reasons Xianyu's family left behind their homeland is unknown, but what is known is that her father, prince Shanqi, enjoyed close ties with and protection of the Russian military. In particular, he forged close bonds with the then staff rittmeister Konstantin Nechaev. And that bonds were so close that Shanqi gave Xianyu for an adoption by the childless family of the Russian officer.\n\nAisin Gioro Xianyu was baptized in Orthodox manner and took name Ekaterina. Being raised in the Russian household, in Orthodox faith and being surrounded by the Russian literature and arts led to Ekaterina fully embracing her new identity - daughter of the loyal Russian officer. Coming from the family with the military background and, perhaps because of the carefree upbringing, Ekaterina developed a rather strong-willed and daring personality. She greatly enjoys horse-riding, which is in itself a pretty an acceptable pastime for a young lady, if Ekaterina wasn't doing it in her custom made military uniform and with weapon in hands. With her own weapon and horse she voluntary joined the raid against local bandits, where she showed resilience and bravery, being one of the first cavalryman to charge right into the of enemy formation. Though, that attack added a few more grey hairs to the commanding officer for an obvious reason."
PBZ_zheltorossiya.15.a:0 "An interesting story, that's for sure."

PBZ_zheltorossiya.16.t:0 "Women Rights In Tsardom"
PBZ_zheltorossiya.16.d:0 "In recent times, Ekaterina Nechaeva became fascinated with the topic of women rights. She gathered around her a group of like-minded people, majority of whom are wives or daughters of our officers, and they started a suffragist club of sorts. Perhaps it will be worthwhile to look into that matter, since our officers are getting nervous. Being met at home everyday with talks about women rights can do that to a man."
PBZ_zheltorossiya.16.a:0 "Give some support to these ideas."
PBZ_zheltorossiya.16.b:0 "Maybe we can accommodate women's wishes a little bit."
PBZ_zheltorossiya.16.c:0 "Women rights? Please, not so loud. We are in a polite society."

PBZ_zheltorossiya.17.t:0 "Report on Tsardom's Military Status"
PBZ_zheltorossiya.17.d:0 "Simply put, our military is not in a good shape. While we have a substantial amount of armed forces, our strategies and tactics are quite obsolete, with many of them dating back to the days of the Great War. In modern times we will be hard pressed in the case of conflict bigger than chasing down bandits and smugglers. Additionally, our equipment is on the same level as our military thinking and we don't have enough of it to even arm our forces. The task of rejuvenating our army is not a small feat to do, but we must act as soon as possible."
PBZ_zheltorossiya.17.a:0 "Report received. Dismissed."

PBZ_zheltorossiya.18.t:0 "Policy on Public Security"
PBZ_zheltorossiya.18.d:0 "Several of our high-ranking government members are becoming wary of our own security services. According to their opinion, security services are becoming too powerful and that they have too much authority, even in matters to which they are officially have nothing to do with. Now there is a push to limit security services powers, but what should we actually do? Leave everything as is or should the limits to be introduced after all?"
PBZ_zheltorossiya.18.a:0 "Our security forces have too much influence. Curb it."
PBZ_zheltorossiya.18.b:0 "Relax security procedures a bit. No need for such wariness."
PBZ_zheltorossiya.18.c:0 "We are surrounded by enemies! We must stay vigilant."

PBZ_zheltorossiya.19.t:0 "Policy on Public Meetings"
PBZ_zheltorossiya.19.d:0 "Policy on Public Meetings"
PBZ_zheltorossiya.19.a:0 "Permit public meetings. Under our supervision, of course."
PBZ_zheltorossiya.19.b:0 "No need to change it."

PBZ_zheltorossiya.20.t:0 "Middle Kingdom Is Ours"
PBZ_zheltorossiya.20.d:0 "In the fight for China our enemies have fallen thanks to the combined might of our armies and wise guidance of our generals. Battle for China was long and brutal but we triumphed and now we must establish order on our new territories and wipe out the remaining resistance. A battle of new kind is ahead of us, as years of fighting left a considerable size of China in ruins, population displaced with epidemics and famines ravaging the land. Relief efforts must be organised and help send to all corners of country. Really, there is no time for rest."
PBZ_zheltorossiya.20.a:0 "Good. Did we mint medals for the occasion?"

PBZ_zheltorossiya.21.t:0 "Should We, Really?"
PBZ_zheltorossiya.21.d:0 "China is in our grasp and its resources and riches will now work only for Russia, not any other world power. That said, the Commission is still there and continues it dealings with Chinese, undercutting our own businesses and taking its piece out of the pie. The question is, what should we do with the Commission? One variant is just renegotiate our deal and that's it, let them live. Another is to finish China's reunification and add Commission's cities and ports to our new Tsardom."
PBZ_zheltorossiya.21.a:0 "We will continue business as usual. But on our terms now."
PBZ_zheltorossiya.21.b:0 "Crush them. The Commission has outlived its usefulness."

