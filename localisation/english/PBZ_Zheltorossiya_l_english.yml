PBZ_MAN_Building_Fleet_Faster:0 "Fleet Expansion Program"
PBZ_MAN_Building_Fleet_Faster_desc:0 "The program aimed at increasing the quantity and quality of our naval forces."

##########################
# FOCUS
##########################

PBZ_MAN_New_East_Tsardom:0 "New Tsardom in the East"
PBZ_MAN_New_East_Tsardom_desc:0 "After the end of the Great War, a new state was established by the Russian Empire on the territory of Manchuria. Zheltorossiya was supposed to serve as the Russian bastion on the Far East but with time it was turned into the dumping ground for the problematic or nonconformist army officers."
PBZ_MAN_Rebuff_Attack:0 "Rebuff the Attack"
PBZ_MAN_Rebuff_Attack_desc:0 "Bandits from the so-called Army of Perpetual Resistance were always a trouble for our Mongolian vassal, constantly slipping across it borders in small groups and harassing locals or starting shootouts with border guards. But this time they committed their entire forces for an attack and are outright invading Mongolia. Of course, our General Staff has prepared plans for that."
PBZ_MAN_Stabilise_Situation:0 "Stabilise Internal Front"
PBZ_MAN_Stabilise_Situation_desc:0 "Though fighting against Army of Perpetual Resistance hardly can be described as a proper war, it still caused unrest all across the country. Rumours are circulating and exaggerated, where shabby and ill-equipped groups of our enemies are turning into strong and invincible armies. People are panicking and measures should be undertaken to restore order."
PBZ_MAN_Pacify_Bandits:0 "Put Down the Bandits"
PBZ_MAN_Pacify_Bandits_desc:0 "Due to general unrest various criminals reared their heads and decided to use this opportunity to enrich themselves. Usually, these undesirable elements of the society consisting of former chinese soldiers and destitute farmers are content with robbing their fellow poor farmers, but with the ongoing conflict they grew bolder and even started attacking merchants' caravans. Punitive actions are required."
PBZ_MAN_Reinforcement_From_Russia:0 "Equipment From Motherland"
PBZ_MAN_Reinforcement_From_Russia_desc:0 "Since our own industry is lacking in many aspects, Russia constantly sends equipment and armaments necessary for supporting our armed forces. One such convoy couldn't have come at a better time, bringing transport, medicaments and rations for our army."
PBZ_MAN_Help_From_Russia:0 "Additional Funds From Motherland"
PBZ_MAN_Help_From_Russia_desc:0 "Our Motherland, alarmed by the fighting near its borders, decided to send special funds to support our government. With this help we can have more leeway regarding the allocation of our budget."
PBZ_MAN_Open_Grain_Granaries:0 "Open Granaries"
PBZ_MAN_Open_Grain_Granaries_desc:0 "Unrest among the populace led to them storming shops in all cities and sweeping any food from the shelves in order to prepare for the worst. Lack of food in its turn fueled the unrest even further. We have no choice but to open the granaries and calm the population."
PBZ_MAN_Agreement_With_Nobles:0 "Negotiate With Qing Nobility"
PBZ_MAN_Agreement_With_Nobles_desc:0 "Former noble families from the Qing Empire, both already living in Manchuria for centuries and those who managed to escape jacobin criminals, have a considerable amount of influence among the Chinese. So far, we didn't utilise them in any official capacity, but maybe it's time to finally put Qing nobles to use."
PBZ_MAN_Victory_Achieved:0 "Victory Achieved"
PBZ_MAN_Victory_Achieved_desc:0 "There was no doubt in the victory over the Army of Perpetual Resistance, at least for our soldiers and officers, but less so for the people living under our protection. Using military victory as a propaganda tool will paint us as heroes and protectors and will boost the popularity of the Russian government."
PBZ_MAN_Report_Internal_Arena:0 "Local Political Landscape"
PBZ_MAN_Report_Internal_Arena_desc:0 "After the occupation of Manchuria and organizing the Russian government, the local political scene underwent considerable changes. Previous powers that be were gone and the new leadership took their place."
PBZ_MAN_Support_Radical_Wing:0 "Support Harbin Faction"
PBZ_MAN_Support_Radical_Wing_desc:0 "There is no need in the changing of the political course. Continue with the support of the Harbin Faction, as their intentions and politics are well aligned with ours. Zheltorossiya needs a very firm hand and Harbin Faction can provide it."
PBZ_MAN_Hunt_For_Dissidents:0 "Hunt For Dissidents"
PBZ_MAN_Hunt_For_Dissidents_desc:0 "Unrest, springing up from the recent war, brought Chinese traitors and Japanese spies out of hiding. They are plotting to overthrow the rightful government and install their own barbaric parody on it. Conducting the security operations against them is needed right now. Find the traitors and arrest them!"
PBZ_MAN_Ramp_Up_Propaganda:0 "Ramp Up War Propaganda"
PBZ_MAN_Ramp_Up_Propaganda_desc:0 "We won one war and the population stirred up with enthusiasm and gratitude for our protection. By increasing efforts in war propaganda we can muster for ourselves further support from the people. We don't even need to invent an enemy, there are plenty of them nearby anyway."
PBZ_MAN_Declare_Mobilisation:0 "Declare Mobilisation"
PBZ_MAN_Declare_Mobilisation_desc:0 "Enemy is at the gate and we need bodies for the inevitable war. While enthusiasm from our victory is still fresh we can pass laws for mobilisation without any protest or discontent. Such enthusiasm will not last for long, so we must act quickly."
PBZ_MAN_Toughen_Citizenship_Laws:0 "Toughen Citizenship Laws"
PBZ_MAN_Toughen_Citizenship_Laws_desc:0 "It's already not easy for the Chinese to get Russian citizenship but it's not enough. Tightening regulations regarding citizenship will show the locals who are the true masters of Manchuria. They must understand that we are in control here."
PBZ_MAN_Privileges_Through_Blood:0 "Privileges Through Blood"
PBZ_MAN_Privileges_Through_Blood_desc:0 "A Chinese who decided to serve in the army of the Tsardom will get citizenship faster and in a simplified manner. Let it be known everywhere and people will have no choice but to join our army. Our propaganda experts even came up with a slogan - Service Guarantees Citizenship!"
PBZ_MAN_Support_Moderate_Wing:0 "Support Navy Clique"
PBZ_MAN_Support_Moderate_Wing_desc:0 "Give the support to the Navy Clique. Navy Clique can be a smaller group in contrast with Harbin Faction but their methods seem a better alternative to the aggressive politics of Harbin Faction."
PBZ_MAN_Decrease_Radicals_Power:0 "Sideline Harbin Faction"
PBZ_MAN_Decrease_Radicals_Power_desc:0 "Inconspicuously move Harbin Faction's officers and civil servants away from the posts with the real power and give them places in some non-essential committees. Let them bicker over who will have a budget and how to make far off plans work."
PBZ_MAN_Divert_Resources:0 "Pay Attention to Civil Government Too"
PBZ_MAN_Divert_Resources_desc:0 "While we are first and foremost a military bastion of Russian influence on the Far East, we shouldn't neglect the civil sides of things. Diverting some funds to the civil government and expanding programs for civilians will boost our popularity."
PBZ_MAN_Change_Rhetoric:0 "Change Rhetoric"
PBZ_MAN_Change_Rhetoric_desc:0 "Changing the aggressive Russification propaganda to a more "soft" and subtle one will endear the population to us. A carrot is much more preferable to stick after all."
PBZ_MAN_Ease_Up_Citizenship_Laws:0 "Lighten Citizenship Laws"
PBZ_MAN_Ease_Up_Citizenship_Laws_desc:0 "It's hard for a Chinese person to get Russian citizenship due to harsh requirements and a limited number of available options. Easing procedures will get us an increased pool of human resources from which we can direct them to where they are needed."
PBZ_MAN_Volunteer_Forces:0 "Manchurian Volunteer Forces"
PBZ_MAN_Volunteer_Forces_desc:0 "A campaign about recruitment and the prestige of military service must be conducted. Any able-bodied Chinese man who enlists in Manchurian Volunteer Forces will instantly get citizenship and an honour to serve the Russian tsar."
PBZ_MAN_Finish_Political_Stuff:0 "Finish With Internal Politicking"
PBZ_MAN_Finish_Political_Stuff_desc:0 "Now that the political course of the country for the nearby time is settled on, we can divert attention to other matters. Reforms in industry, trade and other things are required as soon as possible. Zheltorossiya is too weak economically and we need to fix it."
PBZ_MAN_Ministry_Of_Trade:0 "Ministry of Trade and Industry"
PBZ_MAN_Ministry_Of_Trade_desc:0 "Centralized efforts in upgrading the economy and industry must be done under the watchful eye of a single national ministry. It will pass necessary regulations and lay groundwork for further industry reforms."
PBZ_MAN_Central_Planning_Bureau:0 "Central Bureau of Labour"
PBZ_MAN_Central_Planning_Bureau_desc:0 "This government body will not only direct human resources where they are needed in the most effective manner, but will also come up with drafts for labour laws and regulations. Current laws are outdated and hinder economic progress."
PBZ_MAN_Chamber_Of_Commerce:0 "Eastern Chamber of Commerce"
PBZ_MAN_Chamber_Of_Commerce_desc:0 "A new chamber of commerce will unite all Russian and Chinese merchants located in Zheltorossiya, where they will be able to effectively represent their interests. Not only will it clear trade disputes, but will also allow them to pass suggestions to the government."
PBZ_MAN_Department_Of_Mining:0 "Department of Mining and Metallurgy"
PBZ_MAN_Department_Of_Mining_desc:0 "This department's goal is to develop the mining industry, find new ore deposits and develop the already existing one. Teams will be sent to conduct geological surveys and map Manchurian regions in great detail."
PBZ_MAN_Department_Of_Construction:0 "Department of Construction"
PBZ_MAN_Department_Of_Construction_desc:0 "This department will coordinate works regarding construction of industrial and public buildings and oversee the logistics behind these matters. Beyond that, it will also oversee renovations in our cities, in order to bring them a proper European look."
PBZ_MAN_Department_Of_Roads:0 "Department of Roads and Railways"
PBZ_MAN_Department_Of_Roads_desc:0 "This department will oversee the construction of new roads and the laying of new rail tracks. Together with KVZhD it will expand logistic capabilities of our routes, providing for military and civilians fast and safe passage through Manchuria."
PBZ_MAN_Expand_The_Civil_Industry:0 "Invest in Civil Industry"
PBZ_MAN_Expand_The_Civil_Industry_desc:0 "Regrettably, our manufacturing sector is quite behind the times and consists mainly of numerous little Chinese workshops and a small number of Russian owned factories. New investments are needed in order to bring our industry up to modern times."
PBZ_MAN_Scale_Up_Farming_Industry:0 "Scale Up Agricultural Sector"
PBZ_MAN_Scale_Up_Farming_Industry_desc:0 "The agricultural sector of Zheltorossiya suffers from the same problems as the industrial one. Farmlands, consisting of the small patches, worked on by the poor peasants and using methods from hundred years ago can hardly be called a real farming industry. Modernization is needed."
PBZ_MAN_Electrify_The_Countryside:0 "Electrify the Countryside"
PBZ_MAN_Electrify_The_Countryside_desc:0 "While central regions of Zheltorossiya do have an access to electricity, even if in a limited quantity, the far outer areas lack even that. Building Tesla Towers there will somewhat alleviate the problem."
PBZ_MAN_Build_The_Suiho_Dam:0 "Finish Suiho Dam"
PBZ_MAN_Build_The_Suiho_Dam_desc:0 "The construction of the dam on Yalu river, on the border with Korea, was started in 1930 and continues to this day, though the pace was slowed because of temporary lack of funds. Allocating them and giving additional labour to the project will help finish it even sooner than what was planned years ago."
PBZ_MAN_Expand_The_Military_Industry:0 "Expand Military Industry"
PBZ_MAN_Expand_The_Military_Industry_desc:0 "Our military-industrial sector is in a bit better shape than civilian one, but it will hardly be sufficient in the foreseeable future. We need to expand it, since we can't forever rely on the support our Motherland gives us."
PBZ_MAN_Deal_With_Rubber_Shortage:0 "Deal With Rubber Shortage"
PBZ_MAN_Deal_With_Rubber_Shortage_desc:0 "Rubber is one of the most important resources and we, unfortunately, are lacking in means of its production. Since Manchuria lacks plants necessary for the creation of natural rubber, we will make do with the synthetic one."
PBZ_MAN_Develop_Roads:0 "Develop Infrastructure"
PBZ_MAN_Develop_Roads_desc:0 "Majority of roads in cities and outside of them are in a bad shape and hinder the transportation of goods and our troops. The project directed to upgrade road infrastructure and at the same time give people work will be very useful."
PBZ_MAN_Build_Railway_In_Chahar:0 "Build Railway to Chahar"
PBZ_MAN_Build_Railway_In_Chahar_desc:0 "The border region Chahar lacks any railways and has poor road infrastructure. It must be fixed since it borders the Jacobins terrorists and they can attack us at any moment."
PBZ_MAN_Ministry_Of_Foreign_Affairs:0 "Ministry of Foreign Affairs"
PBZ_MAN_Ministry_Of_Foreign_Affairs_desc:0 "So far, we have had only limited diplomatic relationships with the other countries, mostly because of our doubtful legitimate status. Only countries in the Russian sphere of influence have regular contacts with us. Establishing the Ministry of Foreign Affairs will overcome this problem."
PBZ_MAN_European_Department:0 "European Department"
PBZ_MAN_European_Department_desc:0 "The European continent is gripped with tension and fear. Another big war looms on the horizon and many countries are searching, if not for allies, than at least for friends. An unofficial ambassador party sent to Europe will suggest such friendship."
PBZ_MAN_Contact_Fellow_Orthodox_Nations:0 "Contact Fellow Orthodox Nations"
PBZ_MAN_Contact_Fellow_Orthodox_Nations_desc:0 "Though the majority of Zheltorossiya's population follows various eastern religions, we consider ourselves an Orthodox country. Forming closer ties with Orthodox nations in Europe will help us establish the legitimate claims over Manchuria with their support."
PBZ_MAN_Further_Overtures_Towards_Europe:0 "Make Further Overtures Towards Europe"
PBZ_MAN_Further_Overtures_Towards_Europe_desc:0 "Now that we have established contacts, even if some of them are not official, we can talk business. Access to European markets is a very enticing possibility, very enticing indeed."
PBZ_MAN_Asian_Department:0 "Asian Department"
PBZ_MAN_Asian_Department_desc:0 "Understandably, the Asian department will be the central one, as it will be the main instrument in expanding Russian influence all across the Orient. We will contact potentially friendly nations around us in order to safeguard Russian interests in the region."
PBZ_MAN_Help_Xinjiang_Forces:0 "Help Xinjiang Expedition"
PBZ_MAN_Help_Xinjiang_Forces_desc:0 "The expedition, sent to subside another bunch of bandits and establish an additional route to Russia, has bogged down in fighting with said bandits. Until now, they didn't make much progress in their tasks and they need help."
PBZ_MAN_Friendship_With_Korea:0 "Friendship With Korea"
PBZ_MAN_Friendship_With_Korea_desc:0 "The Korean Empire is the main candidate for being our ally, according to our diplomats. Relatively recently they gained freedom from the Japanese and hold no love for them. They also don't have much sympathy for the Jacobins anarchists in China."
PBZ_MAN_Contact_Plutocrats:0 "Dealings With Commission's Plutocrats"
PBZ_MAN_Contact_Plutocrats_desc:0 "Though European Powers banished the Russian Empire from the Commission, it matters little, at least in what involves dealings with them. For a specific sum of money, plutocrats sitting in the Commission are ready to sell anyone and anything."
PBZ_MAN_American_Department:0 "American Department"
PBZ_MAN_American_Department_desc:0 "American continents are far and it's unlikely that countries situated there care much for us, but there can't be too many friends in politics. An ambassador party will be send to American countries to measure their willingness for closer ties."
PBZ_MAN_Heading_Further_South:0 "Heading Further South"
PBZ_MAN_Heading_Further_South_desc:0 "There are some more countries in South America who share our values and views on politics. Let's contact and extend a hand of friendship to them."
PBZ_MAN_Sign_Lucrative_Deals:0 "Sign Lucrative Deals"
PBZ_MAN_Sign_Lucrative_Deals_desc:0 "Us and American countries are separated by the huge distances and vast oceans, but making trade deals for the future is a good idea. It would be nice to have some tropical fruits here..."
PBZ_MAN_Ministry_Of_Culture:0 "Ministry of Culture and Public Education"
PBZ_MAN_Ministry_Of_Culture_desc:0 "This esteemed government office will take upon itself the tasks of Russification and proper education of the Manchurian population. The Ministry of Culture will forge a nation of people loyal to Russia and Russia alone."
PBZ_MAN_Open_Publicly_Funded_Schools:0 "Open Publicly Funded Schools"
PBZ_MAN_Open_Publicly_Funded_Schools_desc:0 "The literacy level of the general population in Zheltorossiya is pretty abysmal. We can start solving this problem by opening new schools and inviting teachers from Russia. They will educate the young generation about the world in a patriotic manner and fully loyal to Russia."
PBZ_MAN_Organize_Night_Schools:0 "Organize Night Schools For Workers"
PBZ_MAN_Organize_Night_Schools_desc:0 "It's not enough to teach only young people. Adults need education too, even if it will be harder to instill in the already matured person what we want them to believe and think. Obviously, we will try to do it anyway, with the additional benefit of getting an educated and better trained workforce."
PBZ_MAN_Expand_Harbin_University:0 "Additional Funds For Harbin Institute"
PBZ_MAN_Expand_Harbin_University_desc:0 "The Harbin Institute of Technology is the oldest academic institution in Manchuria. Opened in 1920, it helped to graduate numerous engineers and specialists in other fields. Increasing funding for it is the unmistakable decision. Science will shape the future and we must be part of it."
PBZ_MAN_Contact_Area_Zero:0 "Contact §RREDACTED§!"
PBZ_MAN_Contact_Area_Zero_desc:0 "Area Zero is a top secret project known only to the highest ranking officials of the Russian Empire. Since, well, we are the highest ranking officials, we of course know about it. Offering them some funds in exchange for some of their scientists' expertise will help our academic pursuits."
PBZ_MAN_Meeting_Qing_Nobles_Again:0 "Meeting With Qing Nobles Again"
PBZ_MAN_Meeting_Qing_Nobles_Again_desc:0 "We should continue working with the Qing aristocrats, as the dealings we made with them in the past proved to be fruitful. Throwing the former nobility another bone in exchange for further support won't cost us much and will bring many benefits to the country."
PBZ_MAN_Friends_From_Among_Manchu:0 "Friends From Among Manchu"
PBZ_MAN_Friends_From_Among_Manchu_desc:0 "There are many Chinese who are not content with Russia coming and taking power in her hands. Equally, there are many who are ready to work with us and for us. Such people have different reasons to do so, though their reasons do not really matter to us, as long as people stay obedient."
PBZ_MAN_Unexpected_Question:0 "Unexpected Question"
PBZ_MAN_Unexpected_Question_desc:0 "The liberal trends managed to infiltrate even into our otherwise polite society. More often, women raise the question about their position in institutions and communities. So far, there were no marches or other social disruptions from their side but only talks in women's clubs and tea-houses. Maybe it's better to address this question before it becomes a problem."
PBZ_MAN_Orthodox_Church_In_Manchuria:0 "Orthodox Church in Manchuria"
PBZ_MAN_Orthodox_Church_In_Manchuria_desc:0 "Orthodox Church is one of the pillars of the Russification program in Manchuria. While other projects had, at best, limited success, the Church managed to gain some influence among the populace. Mainly because of its charitable work in the poorer regions and the requirement of converting to Orthodox faith for getting Russian citizenship."
PBZ_MAN_Cultural_Rennovation_Program:0 "Program of Cultural Renovation"
PBZ_MAN_Cultural_Rennovation_Program_desc:0 "All across Zheltorossiya old and new buildings will be renovated or constructed in a Russian style architecture. Towns and villages will be renamed in a manner which Russian ears are accustomed to and changing the currently foreign sounding names will erase the vestiges of old Qing authority."
PBZ_MAN_Intensify_Manchu_Russification:0 "Intensify Efforts in Russification"
PBZ_MAN_Intensify_Manchu_Russification_desc:0 "We will utilize every instrument in our disposal in order to accelerate the Russification of Manchuria - simple posters and cheap tickets to cinematography for the uneducated masses, radio programs and newspapers for the Manchu upper classes. Schools will mainly concentrate on teaching Russian rather than Manchu or Mandarin Chinese."
PBZ_MAN_Public_Health_Office:0 "Public Health Office"
PBZ_MAN_Public_Health_Office_desc:0 "This governmental organization was founded in 1910 in response to the outbreak of pneumonic plague in Manchuria. Only with its help the plague was stopped before it could cause mass casualties. Increasing the Public Health Office's budget will help prevent future epidemics and will increase popularity of our government."
PBZ_MAN_Public_Security_Office:0 "Security Department Policy"
PBZ_MAN_Public_Security_Office_desc:0 "We should update and overview the policies on public security. The current ones are causing friction with the population and we must decide if it will be better to change policies or leave them as they are."
PBZ_MAN_Ministry_Of_Defence:0 "Ministry of Defence"
PBZ_MAN_Ministry_Of_Defence_desc:0 "Ministry of Defence is the central and most important institution in the Tsardom. The existence and survival of Zheltorossiya is completely dependent on how well the Ministry of Defence is operated and organized. Enemies are plotting our demise and we must prepare."
PBZ_MAN_Army_Department:0 "Army Department"
PBZ_MAN_Army_Department_desc:0 "Army Department will direct our land troops, set up war plans and train and mobilize forces in case of military action. But the most important role for it is to decide on the direction of the army development. Our military doctrine is outdated and requires extensive upgrades. The Army Department will draw out recommendations for a further course of actions."
PBZ_MAN_Infantry_Doctrine:0 "Insurmountable Defence: Mass Mobilisation"
PBZ_MAN_Infantry_Doctrine_desc:0 "Insurmountable Defence is the doctrine about, as the name implies, absolute and impenetrable defence. It's oriented on the holding of ground and slow, methodical movement forward once the enemy has exhausted itself from the attacks. And if the enemy doesn't want to attack us then we just pummel them with artillery. The first step in developing this doctrine is increasing the number of troops."
PBZ_MAN_Infantry_Development:0 "Insurmountable Defence: Weapons Development"
PBZ_MAN_Infantry_Development_desc:0 "It's not enough to just gather a legion of soldiers, they need the weapons too. Rifles, grenades, machine guns and artillery must be in such surplus that the loss of ten thousands of equipment would barely be a dent in our reserve. Research teams will get an order to develop and optimize the process of weaponry production in order to reach this goal."
PBZ_MAN_Infantry_Trenches:0 "Insurmountable Defence: Trench Warfare"
PBZ_MAN_Infantry_Trenches_desc:0 "Imagine - kilometres of minefields, barbed wire, bunkers, trenches and tunnels filled to the brim with soldiers and artillery. Each trench taken by the enemy will be paid in blood tenfold, each fallen bunker will be a tomb for hundred enemies and every tunnel occupied will be a mass grave for them. No adversary will ever reach the end of our defence lines."
PBZ_MAN_Mobile_Forces_Doctrine:0 "Swift Strikes: R&D of Armoured Vehicles"
PBZ_MAN_Mobile_Forces_Doctrine_desc:0 "This doctrine relies on creation and maintaining large armoured forces, which will tear through enemy lines at the lightning speed and penetrate any defences. We should obtain the most fearsome landships and automats. But first, we need to direct resources into their research and development."
PBZ_MAN_Mobile_Forces_School:0 "Swift Strikes: National Armoured Forces School"
PBZ_MAN_Mobile_Forces_School_desc:0 "A few specialized schools for training armoured vehicles crews will be opened in Zheltorossiya. It will ensure that crews of landships and other vehicles will be familiar with how to operate them and won't panic and stay calm in emergency situations. It will drastically reduce the number of losses, both in people and vehicles."
PBZ_MAN_Mobile_Landship_Maneuvers:0 "Swift Strikes: Landships Maneuvers"
PBZ_MAN_Mobile_Landship_Maneuvers_desc:0 "Theory is well and good but it's practice that allows to fully realize armoured warfare potential. Army exercises, in different weather conditions and in varying terrain, must be conducted regularly. That way, our soldiers armed with knowledge and tempered with practice will be unstoppable. Armoured waves will crush everything in their way."
PBZ_MAN_Special_Forces_Doctrine:0 "Commandos Operations: Special Forces Initiative"
PBZ_MAN_Special_Forces_Doctrine_desc:0 "Commandos Operations doctrine is based on elevating special units and centralizing army around them. While conventional forces are holding down the line, Marines strike from waters, Jet Troopers are landing in the enemies rear, Hardsuits are blazing through enemy lines and Razormaidens are eliminating senior officers."
PBZ_MAN_Special_Augmented_Units:0 "Commandos Operations: Project §YBOGATYR§!"
PBZ_MAN_Special_Augmented_Units_desc:0 "Project §YBOGATYR§! is a secret scientific program designed to improve augmented units. Hardsuits will hit harder and become much harder to kill and Razormaidens will become stronger and faster. Harbin Institute of Technology working on this project has already shown great results."
PBZ_MAN_Special_From_Skies:0 "Commandos Operations: Lightning From the Skies"
PBZ_MAN_Special_From_Skies_desc:0 "Jet Troopers and Paratroopers will get additional training and resources due to their ability to quickly land, eliminate any resistance and hold out against the superior forces, while waiting for the arrival of reinforcements. They truly will become the cream of the crop."
PBZ_MAN_New_Cossack_Host:0 "New Cossack Host"
PBZ_MAN_New_Cossack_Host_desc:0 "For centuries, Cossacks protected the borders of our Motherland. They valiantly fought against numerous enemies, settled new frontiers and guarded Russian interests in Europe and Asia. Manchuria is not an exception and Cossacks slowly but methodically are buidling new homes for themselves here. It's time to formalize the creation of the new Cossack Host - Sungariyskiy."
PBZ_MAN_Cossack_Frontier_Spirit:0 "Cossack Frontier Spirit"
PBZ_MAN_Cossack_Frontier_Spirit_desc:0 "Cossacks are famous for their daring and fearless attitude both in war and in peaceful times. Considering that war looms on the horizon, we can always count on Cossacks. Let's draw on their expertise and in return give any support they need."
PBZ_MAN_Revise_War_Plans:0 "Revise War Plans"
PBZ_MAN_Revise_War_Plans_desc:0 "Considering the changings in geopolitical situation and the further advancements in military thought, the update of our war plans is necessary right now. Let the General Staff revise our plans and bring them before the tsar and senior officers."
PBZ_MAN_War_Games:0 "Combined Arms War Games"
PBZ_MAN_War_Games_desc:0 "Massive army exercises are planned to be carried on in the near future. All branches of the military will take part in it and every soldier, from privates to high-ranking officers, will be put in action."
PBZ_MAN_Air_Force_Department:0 "Air Force Department"
PBZ_MAN_Air_Force_Department:0 "The Air Force Department awaits a difficult job: creating Zheltorossian air forces from scratch. Pilots are needed to be trained, air fields to be built and more importantly the planes to be obtained somehow. Let's start by requesting a small number of fighters from the Motherland."
PBZ_MAN_Build_Aircraft_Industry:0 "Build Aircraft Industry From Scratch"
PBZ_MAN_Build_Aircraft_Industry_desc:0 "We lack the industry necessary for the building of independent air forces. We can alleviate this problem by importing specialists and equipment from the Russian Empire. First of all, we will construct maintenance facilities for our existing planes with specialists' help and then we will expand them."
PBZ_MAN_Develop_Aviation:0 "Develop Aeronautics"
PBZ_MAN_Develop_Aviation_desc:0 "Aeronautics is an exact science and demands a considerable amount of funds to be of use. We are ready to make such sacrifices, as it means we will get equally considerable powers that will help defeat our enemies."
PBZ_MAN_Pilot_Academy:0 "Pilot Academy"
PBZ_MAN_Pilot_Academy_desc:0 "Now that we have planes and means to repair and construct them, we need people to crew them. Not everyone has the talent, guts and intuition to pilot an aircraft, let alone fight in one. Pilot academy will find such people, train and make them the elite of our military forces."
PBZ_MAN_CAS_Planes:0 "Close Support Doctrine"
PBZ_MAN_CAS_Planes_desc:0 "This doctrine stands for the idea of the combined interplay of air and ground forces. Troops on land are constantly provided with the air support of planes flying in a low-altitude, raining bombs and rockets on the enemy fighting our army. So to speak, the support aircrafts take the role of flying artillery."
PBZ_MAN_Tactical_Bombers:0 "Tactical Bombers Doctrine"
PBZ_MAN_Tactical_Bombers_desc:0 "This doctrine favors the use of the so-called air interdiction tactic, where bombers disrupt supply routes and eliminate enemy reinforcements before they reach the destination. Tactical bombers are mostly acting out of the zones of active fighting and generally provide indirect support."
PBZ_MAN_Navy_Department:0 "Navy Department"
PBZ_MAN_Navy_Department_desc:0 "Zheltorossiya has a small fleet, mainly used for chasing pirates and patrolling the waters in case Jacobins bandits from Japan decide to attack us. We should expand our fleet and the Navy Department will work on that task."
PBZ_MAN_Expand_Dockyards:0 "Expand Dockyards"
PBZ_MAN_Expand_Dockyards_desc:0 "Extending the only dockyard we have in Liaotung is the first step in the building of our navy. With the new dockyards we can repair and upgrade ships much faster."
PBZ_MAN_Naval_Training:0 "Naval Training"
PBZ_MAN_Naval_Training_desc:0 "It's not enough to just merely patrol the waters, regular naval exercises are needed to make sailors accustomed to the duties on the ships. An experienced sailor won't panic and will precisely follow the orders of his superiors."
PBZ_MAN_Submarine_Fleet:0 "Wolf Pack: Submarines Doctrine"
PBZ_MAN_Submarine_Fleet_desc:0 "The Navy Department decided to adopt the Wolf Pack doctrine, where submarines get a leading role in our fleet. Submarine packs will silently hunt down enemy ships and disrupt their supply routes, sapping our adversaries strength."
PBZ_MAN_Destroyer_Fleet:0 "Mobile Fleet: Destroyers Doctrine"
PBZ_MAN_Destroyer_Fleet_desc:0 "The Navy Department decided to adopt the Mobile Fleet doctrine, where destroyers are built en masse. Destroyers are fast and multifunctional, able to scout for enemy, patrol waters and take out much bigger ships at the same time."
PBZ_MAN_China_United:0 "China United"
PBZ_MAN_China_United_desc:0 "Main contenders for the unification of China have fallen and only we are proudly standing, victorious and undefeated. Before us are the difficult tasks of consolidating the power over the new territories, hunting down the remnants of our enemies and establishing peace and order. Already our armed forces are securing key locations across China and military administrations are being formed."
PBZ_Pacify_Northern_China:0 "Pacify Northern China"
PBZ_Pacify_Northern_China_desc:0 "The territories of the former Jacobins menace are in our hands and now we need to stomp out the still smoldering embers of anarchy and revolution. The most fanatical Jacobins are still resisting in futile attempts, but only bullets to their heads or gallows await them."
PBZ_Pacify_Southern_China:0 "Pacify Southern China"
PBZ_Pacify_Southern_China_desc:0 "The lands controlled by the fallen Heavenly Kingdom are ours. Fortunately, decades of the rule by the people who distorted the Christian teachings are behind and normalcy returns to the people living here, since our administration already has plans for our new territories."
PBZ_Claim_Dragon_Throne:0 "Claim the Dragon Throne"
PBZ_Claim_Dragon_Throne_desc:0 "A new nation is born under the auspicious rule of the Russian dynasty. A proclamation about establishing the Great Tsardom of Kitai resounded all across the world and country. And while the international community was slow to react, people inside the new country rejoiced. Mostly because wars have ended and they were glad to finally wake up to the songs of birds, not the sounds of bullets and explosions."
PBZ_War_With_Commission:0 "Reclaim What Others Have Lost"
PBZ_War_With_Commission_desc:0 "Most territories of the Middle Kingdom are ours or belong to our allies. But some important lands, like ports, are in the hands of the Quadrilateral Commission, the band of European oligarchs. So, the question stands - what to do with the Commission?"

